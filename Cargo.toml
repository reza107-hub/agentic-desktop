[workspace]
members         = ["crates/core", "crates/linux", "crates/macos", "crates/windows", "src"]
default-members = ["crates/core", "crates/linux", "crates/macos", "crates/windows", "src"]
resolver        = "2"

[workspace.package]
edition      = "2024"
rust-version = "1.89"
license      = "Apache-2.0"
version      = "0.1.0"

[workspace.dependencies]
clap                  = { version = "4", features = ["derive"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
agentic-desktop-core  = { path = "crates/core" }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
